name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Cache Docker Image Layer
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('./package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            MONGO_MAIN=${{ secrets.MONGO_MAIN }}
            FIREBASE_WEB_CONFIG=${{ env.FIREBASE_WEB_CONFIG }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'testing' }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
        env:
          IMAGE_NAME: "dacvuips/virtual-try-on"
          FIREBASE_WEB_CONFIG: '{"apiKey":"AIzaSyDqyI36RhRo9iWjs-7QRLPYmBMCuOq_cUk","authDomain":"virtual-try-on-b43f5.firebaseapp.com","projectId":"virtual-try-on-b43f5","storageBucket":"virtual-try-on-b43f5.firebasestorage.app","messagingSenderId":"136275169192","appId":"1:136275169192:web:2d3757063ff7a50dd1979d","measurementId":"G-WVP1GJGPJJ"}'
      - name: Verify
        run: echo ${{ steps.build.outputs.digest }}
